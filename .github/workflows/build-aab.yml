name: Build Play Store AAB

# 플레이스토어 업로드용 AAB 파일 만들기
# GitHub > Actions > Build Play Store AAB > Run workflow 를 눌러서 실행 (자동 실행 안 함)
# 필요한 Secrets: UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_PASSWORD, UPLOAD_KEY_ALIAS
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          npx expo install @expo/vector-icons expo-font expo-asset
          npx expo install --fix

      # 올릴 때마다 버전 번호가 커져야 함 (실행 번호 + 100)
      - name: Set version code
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER) + 100;
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
            console.log("versionCode =", j.expo.android.versionCode);
          '

      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
          sed -i "/dependencyResolutionManagement/,/}/ s|repositories {|repositories {\n        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }|g" android/settings.gradle || true
          node -e '
            const fs = require("fs");
            const path = require("path");
            let fontVer = "13.3.0";
            try {
              const pkg = JSON.parse(fs.readFileSync("node_modules/expo-font/package.json", "utf8"));
              if (pkg.version) fontVer = pkg.version;
            } catch (_) {}
            function patchObj(obj) {
              let changed = false;
              if (!obj || typeof obj !== "object") return false;
              if (Array.isArray(obj)) {
                for (const item of obj) {
                  if (patchObj(item)) changed = true;
                }
                return changed;
              }
              if (obj.publication && typeof obj.publication === "object" && !obj.publication.version) {
                const modStr = JSON.stringify(obj);
                obj.publication.version = modStr.includes("font") ? fontVer : "1.0.0";
                changed = true;
              }
              for (const k of Object.keys(obj)) {
                if (patchObj(obj[k])) changed = true;
              }
              return changed;
            }
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === ".git") continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith(".json")) {
                  try {
                    const raw = fs.readFileSync(full, "utf8");
                    if (raw.includes("\"publication\"")) {
                      const parsed = JSON.parse(raw);
                      if (patchObj(parsed)) {
                        fs.writeFileSync(full, JSON.stringify(parsed, null, 2));
                        console.log("PATCHED:", full, "fontVer:", fontVer);
                      }
                    }
                  } catch (_) {}
                }
              }
            }
            walk(".");
          '
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # 플레이스토어 요구: Android 16 (API 36) 대상으로 빌드
      - name: Target API 36
        run: |
          node -e '
            const fs = require("fs");
            const f = "android/build.gradle";
            let g = fs.readFileSync(f, "utf8");
            const mark = g.search(/apply plugin:\s*["\x27]expo-root-project["\x27]/);
            if (mark < 0) { console.log("expo-root-project 줄을 못 찾음"); process.exit(1); }
            const ext = "ext {\n    compileSdkVersion = 36\n    targetSdkVersion = 36\n}\n";
            g = g.slice(0, mark) + ext + g.slice(mark);
            fs.writeFileSync(f, g);
            console.log("API 36 설정 완료");
          '
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      # 업로드 열쇠로 서명하도록 설정
      - name: Set up upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "UPLOAD_KEYSTORE_BASE64 Secret 이 없어요"; exit 1; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > android/app/upload.jks
          node -e '
            const fs = require("fs");
            const f = "android/app/build.gradle";
            let g = fs.readFileSync(f, "utf8");
            const rel = [
              "        release {",
              "            storeFile file(\"upload.jks\")",
              "            storePassword System.getenv(\"UPLOAD_STORE_PASSWORD\")",
              "            keyAlias System.getenv(\"UPLOAD_KEY_ALIAS\")",
              "            keyPassword System.getenv(\"UPLOAD_KEY_PASSWORD\")",
              "        }",
            ].join("\n");
            const s = g.indexOf("signingConfigs {");
            if (s < 0) { console.log("signingConfigs 를 못 찾음"); process.exit(1); }
            const at = s + "signingConfigs {".length;
            g = g.slice(0, at) + "\n" + rel + g.slice(at);
            const bt = g.indexOf("buildTypes {");
            const r = g.indexOf("release {", bt);
            const sc = g.indexOf("signingConfig signingConfigs.debug", r);
            if (bt < 0 || r < 0 || sc < 0) { console.log("release 서명 줄을 못 찾음"); process.exit(1); }
            g = g.slice(0, sc) + "signingConfig signingConfigs.release" + g.slice(sc + "signingConfig signingConfigs.debug".length);
            fs.writeFileSync(f, g);
            console.log("서명 설정 완료");
          '

      - name: Build AAB
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            let fontVer = "13.3.0";
            try {
              const pkg = JSON.parse(fs.readFileSync("node_modules/expo-font/package.json", "utf8"));
              if (pkg.version) fontVer = pkg.version;
            } catch (_) {}
            function patchObj(obj) {
              let changed = false;
              if (!obj || typeof obj !== "object") return false;
              if (Array.isArray(obj)) {
                for (const item of obj) {
                  if (patchObj(item)) changed = true;
                }
                return changed;
              }
              if (obj.publication && typeof obj.publication === "object" && (!obj.publication.version || obj.publication.version === "0.0.0")) {
                const modStr = JSON.stringify(obj);
                obj.publication.version = modStr.includes("font") ? fontVer : "1.0.0";
                changed = true;
              }
              for (const k of Object.keys(obj)) {
                if (patchObj(obj[k])) changed = true;
              }
              return changed;
            }
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === ".git") continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith(".json")) {
                  try {
                    const raw = fs.readFileSync(full, "utf8");
                    if (raw.includes("\"publication\"")) {
                      const parsed = JSON.parse(raw);
                      if (patchObj(parsed)) {
                        fs.writeFileSync(full, JSON.stringify(parsed, null, 2));
                        console.log("PATCHED:", full, "fontVer:", fontVer);
                      }
                    }
                  } catch (_) {}
                }
              }
            }
            walk(".");
          '
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Rename AAB
        run: mv android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/me-playstore.aab

      - name: Upload AAB to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-aab
          name: 플레이스토어 업로드용 (AAB)
          files: android/app/build/outputs/bundle/release/me-playstore.aab
          overwrite: true

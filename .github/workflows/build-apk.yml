name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          npx expo install @expo/vector-icons expo-asset
          npx expo install --fix

      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
          sed -i "/dependencyResolutionManagement/,/}/ s|repositories {|repositories {\n        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }|g" android/settings.gradle || true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Bundle JS and Build APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          node -e '
            const fs = require("fs");
            const path = require("path");
            function patchObj(obj) {
              let changed = false;
              if (!obj || typeof obj !== "object") return false;
              if (Array.isArray(obj)) {
                for (const item of obj) {
                  if (patchObj(item)) changed = true;
                }
                return changed;
              }
              if (obj.publication && typeof obj.publication === "object" && !obj.publication.version) {
                obj.publication.version = "0.0.0";
                changed = true;
              }
              for (const k of Object.keys(obj)) {
                if (patchObj(obj[k])) changed = true;
              }
              return changed;
            }
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === ".git") continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.endsWith(".json")) {
                  try {
                    const raw = fs.readFileSync(full, "utf8");
                    if (raw.includes("\"publication\"")) {
                      const parsed = JSON.parse(raw);
                      if (patchObj(parsed)) {
                        fs.writeFileSync(full, JSON.stringify(parsed, null, 2));
                        console.log("PATCHED:", full);
                      }
                    }
                  } catch (_) {}
                }
              }
            }
            walk(".");
          '
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 최신 테스트 앱 (APK)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
